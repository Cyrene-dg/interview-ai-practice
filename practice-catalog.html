<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>题库目录 · InterviewAI</title>
  <link rel="stylesheet" href="practice-style.css?v=20260902-1">
  <style>
    .mobile-directory-button,.mobile-directory-overlay{display:none}
    @media(max-width:800px){
      body.drawer-open{overflow:hidden}
      .mobile-directory-button{display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border:0;border-radius:9px;background:#efedff;color:#635bdf;font-weight:900}
    .mobile-directory-overlay{display:block;position:fixed;inset:0;z-index:20;background:#19213766}
      .mobile-directory-overlay[hidden]{display:none}
      .mobile-directory-drawer{width:min(330px,85vw);height:100%;padding:19px 12px;overflow-y:auto;background:#fff;box-shadow:15px 0 38px #17203933}
      .drawer-head{display:flex;align-items:center;justify-content:space-between;margin:0 8px 18px}
      .drawer-head strong{font-size:20px}
      .drawer-head button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:#f0f2f7;color:#4d5b70;font-size:24px;line-height:1}
    }
  </style>
</head>
<body data-page="catalog">
  <div class="shell">
    <header class="top">
      <a class="brand" href="practice-catalog.html">Interview<span>AI</span></a>
      <button id="openMobileDirectory" class="mobile-directory-button" type="button">☰ 题库目录</button>
      <div class="top-note"><a class="notes-link" href="practice-notes.html">我的笔记</a><a class="notes-link" href="practice-sync.html">跨设备同步</a>个人刷题库 <span id="totalCount"></span></div>
    </header>
    <div id="mobileDirectory" class="mobile-directory-overlay" hidden>
      <aside class="mobile-directory-drawer" aria-label="手机题库目录">
        <div class="drawer-head"><strong>题库目录</strong><button id="closeMobileDirectory" type="button" aria-label="关闭目录">×</button></div>
        <div class="side-title">题库</div>
        <div id="mobileCourseList" class="course-list"></div>
        <div class="side-divider"></div>
        <div class="side-title">分类</div>
        <div id="mobileCategoryList" class="category-list"></div>
      </aside>
    </div>
    <main class="catalog-layout">
      <aside class="sidebar" aria-label="题库分类">
        <div class="side-title">题库</div>
        <div id="courseList" class="course-list"></div>
        <div class="side-divider"></div>
        <div class="side-title">分类</div>
        <div id="categoryList" class="category-list"></div>
      </aside>
      <section class="content-card">
        <div class="catalog-head">
          <div>
            <div id="crumb" class="crumb"></div>
            <h1 id="catalogTitle">题库目录</h1>
            <p id="catalogSummary" class="muted"></p>
          </div>
          <div id="progressSummary" class="progress-summary"></div>
        </div>
        <div class="filters">
          <label class="search-box"><span>⌕</span><input id="searchInput" placeholder="搜索题目标题或内容"></label>
          <select id="typeFilter" aria-label="按题型筛选"></select>
          <select id="statusFilter" aria-label="按完成状态筛选">
            <option value="all">全部状态</option><option value="unmade">未做</option><option value="correct">答对</option><option value="wrong">答错</option><option value="mastered">已掌握</option><option value="unmastered">待复习</option>
          </select>
        </div>
        <div class="question-table-head"><span>题号</span><span>题目名称</span><span>题型</span><span>状态</span></div>
        <div id="questionList" class="question-list"></div>
        <div id="pager" class="pager"></div>
      </section>
    </main>
  </div>
  <script src="practice-bank.js"></script><script src="practice-taxonomy.js?v=20260902-1"></script><script src="practice-firebase-config.js?v=20260828-3"></script><script src="practice-app.js?v=20260902-1"></script><script type="module" src="practice-sync.js?v=20260828-3"></script>
</body>
</html>
