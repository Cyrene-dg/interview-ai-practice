<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>笔记与备份 · InterviewAI</title>
  <link rel="stylesheet" href="practice-style.css">
</head>
<body>
  <div class="shell notes-shell">
    <header class="top"><a class="brand" href="practice-catalog.html">Interview<span>AI</span></a><a class="top-back" href="practice-catalog.html">← 返回题库</a></header>
    <main class="notes-card">
      <div class="notes-head"><div><div class="crumb"><span>个人刷题库</span><i>/</i><span>笔记与备份</span></div><h1>我的笔记</h1><p id="noteSummary" class="muted">正在读取笔记…</p></div><div class="note-tools"><button id="exportReadable" class="secondary">导出可阅读笔记</button><button id="exportJson" class="secondary">备份全部笔记</button><label class="primary import-label">导入备份<input id="importNotes" type="file" accept="application/json,.json" hidden></label></div></div>
      <div class="notes-tip">笔记仅保存在这台设备的当前浏览器。平时会自动保存；“备份全部笔记”用于以后恢复，“导出可阅读笔记”可直接打开查看。</div>
      <label class="search-box notes-search"><span>⌕</span><input id="noteSearch" placeholder="搜索题目或笔记内容"></label>
      <section id="noteList" class="note-list"></section>
    </main>
  </div>
  <script src="practice-bank.js"></script><script src="practice-note-store.js"></script><script src="practice-markdown.js"></script><script src="practice-notes.js"></script>
</body>
</html>
